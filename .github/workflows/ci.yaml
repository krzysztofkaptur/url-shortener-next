name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  AWS_REGION: eu-central-1
  # IAM role this workflow logs in as (IAM > Roles > url-shortener-github-deploy > ARN).
  # It trusts only this repo's master branch, so no AWS keys are stored in GitHub.
  # Not a secret: an ARN is just an ID and is useless without passing the role's trust check.
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::144648416456:role/url-shortener-github-deploy
  ECR_REPOSITORY: url-shortener
  ECS_CLUSTER: url-shortener
  ECS_SERVICE: url-shortener-td-service-19du1b3t
  ECS_TASK_DEFINITION: url-shortener-td
  ECS_CONTAINER_NAME: app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

  deploy:
    needs: build
    # Deploy only on pushes to master (including merged pull requests); pull request runs stop after build.
    # The AWS role also rejects any other branch, so this is enforced on both sides.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Only one deploy runs at a time; later merges wait in a queue.
    # cancel-in-progress: false because cancelling a deploy halfway can leave ECS between two versions.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # id-token: write lets the job request a GitHub identity token, which AWS exchanges for temporary credentials.
    # contents: read is needed for checkout; listing permissions removes every other default permission.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ECR is where the finished image is pushed. Docker Hub is needed to build it:
      # the Dockerfile starts FROM dhi.io/node (Docker Hardened Images), which requires a Docker Hub login to download.
      - name: Log in to dhi.io
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Buildx is Docker's newer build engine. Needed for the Dockerfile's RUN --mount=type=cache lines
      # and for the layer cache between runs below (cache-from/cache-to), which makes builds faster.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition > task-definition.json

      - name: Point task definition at the new image
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

    # No invalidation needed: invalidation clears CloudFront's cache, and this app has no CloudFront.
    # This step starts a container with the new image, the load balancer sends traffic to it once health checks pass,
    # and the old container is stopped. The app is live about 3 minutes later, because the target group needs
    # 5 passing health checks 30 seconds apart before switching traffic.
